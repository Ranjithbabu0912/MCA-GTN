<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEABB"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="crestBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081830"/>
      <stop offset="100%" stop-color="#143464"/>
    </linearGradient>
  </defs>

  <!-- Circular College Seal -->
  <circle cx="50" cy="50" r="46" fill="url(#crestBlue)" stroke="url(#crestGold)" stroke-width="3"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5"/>

  <!-- Academic Torch of Wisdom -->
  <path d="M 47,40 L 53,40 L 51,62 L 49,62 Z" fill="url(#crestGold)"/>
  <!-- Flame -->
  <path d="M 50,22 C 54,28 58,32 50,38 C 42,32 46,28 50,22 Z" fill="#F59E0B"/>
  <path d="M 50,26 C 52,30 54,32 50,36 C 46,32 48,30 50,26 Z" fill="#FCD34D"/>

  <!-- Open Laurel Wreath -->
  <path d="M 24,54 C 24,68 36,78 50,78 C 64,78 76,68 76,54" fill="none" stroke="url(#crestGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Letters GTN -->
  <text x="50" y="70" font-family="'Outfit', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">G.T.N.</text>
  <text x="50" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#CBD5E1" text-anchor="middle">ESTD 1964</text>
</svg>
