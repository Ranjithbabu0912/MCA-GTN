<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1D3A"/>
      <stop offset="100%" stop-color="#18427E"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
  </defs>

  <!-- Outer Shield / Hexagonal Tech Crest -->
  <polygon points="50,6 90,26 90,70 50,94 10,70 10,26" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Inner Circuit Border -->
  <polygon points="50,14 82,30 82,66 50,86 18,66 18,30" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Open Academic Book -->
  <path d="M 50,56 C 42,50 30,50 25,52 L 25,66 C 30,64 42,64 50,70 C 58,64 70,64 75,66 L 75,52 C 70,50 58,50 50,56 Z" fill="url(#goldGrad)"/>
  <line x1="50" y1="56" x2="50" y2="70" stroke="#0B1D3A" stroke-width="1.5"/>

  <!-- Modern Computing / Atom & Network Nodes Symbol -->
  <circle cx="50" cy="34" r="7" fill="url(#cyanGrad)"/>
  <ellipse cx="50" cy="34" rx="16" ry="7" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" transform="rotate(-30 50 34)"/>
  <ellipse cx="50" cy="34" rx="16" ry="7" fill="none" stroke="url(#cyanGrad)" stroke-width="1.5" transform="rotate(30 50 34)"/>

  <!-- Tech Dots -->
  <circle cx="34" cy="28" r="2" fill="#FFFFFF"/>
  <circle cx="66" cy="40" r="2" fill="#FFFFFF"/>
  <circle cx="50" cy="18" r="2" fill="#FFFFFF"/>
</svg>
