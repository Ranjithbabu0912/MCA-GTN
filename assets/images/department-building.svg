<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07142A"/>
      <stop offset="60%" stop-color="#0E2448"/>
      <stop offset="100%" stop-color="#143464"/>
    </linearGradient>
    <linearGradient id="glassFacade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.4)"/>
      <stop offset="100%" stop-color="rgba(11, 29, 58, 0.8)"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Sky & Campus Environment -->
  <rect width="800" height="500" fill="url(#bgSky)"/>
  
  <!-- Subtle Stars / Data Pixels in Sky -->
  <circle cx="120" cy="80" r="1.5" fill="#38BDF8" opacity="0.8"/>
  <circle cx="280" cy="60" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="450" cy="110" r="1.5" fill="#38BDF8" opacity="0.7"/>
  <circle cx="680" cy="70" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="730" cy="140" r="1.5" fill="#00E5FF" opacity="0.6"/>

  <!-- Modern Academic Campus Block Architecture -->
  <!-- Main Technology Building Wings -->
  <polygon points="120,440 120,180 340,140 340,440" fill="#0B1D3A" stroke="#1E3E62" stroke-width="2"/>
  <polygon points="340,140 680,170 680,440 340,440" fill="#102A54" stroke="#1E3E62" stroke-width="2"/>

  <!-- High-Tech Glass Window Modules -->
  <!-- Left Wing Windows -->
  <g fill="rgba(56, 189, 248, 0.25)" stroke="rgba(255, 255, 255, 0.15)">
    <rect x="150" y="200" width="35" height="45" rx="3"/>
    <rect x="205" y="195" width="35" height="45" rx="3"/>
    <rect x="260" y="190" width="35" height="45" rx="3"/>

    <rect x="150" y="270" width="35" height="45" rx="3"/>
    <rect x="205" y="265" width="35" height="45" rx="3"/>
    <rect x="260" y="260" width="35" height="45" rx="3"/>

    <rect x="150" y="340" width="35" height="55" rx="3"/>
    <rect x="205" y="335" width="35" height="55" rx="3"/>
    <rect x="260" y="330" width="35" height="55" rx="3"/>
  </g>

  <!-- Right Wing Windows -->
  <g fill="rgba(0, 229, 255, 0.22)" stroke="rgba(255, 255, 255, 0.12)">
    <rect x="380" y="195" width="60" height="45" rx="3"/>
    <rect x="465" y="200" width="60" height="45" rx="3"/>
    <rect x="550" y="205" width="60" height="45" rx="3"/>

    <rect x="380" y="265" width="60" height="45" rx="3"/>
    <rect x="465" y="270" width="60" height="45" rx="3"/>
    <rect x="550" y="275" width="60" height="45" rx="3"/>

    <!-- Central Grand Atrium Entrance -->
    <rect x="380" y="340" width="230" height="100" fill="url(#glassFacade)" stroke="#00E5FF" stroke-width="1.5" rx="6"/>
  </g>

  <!-- Department Signboard on Facade -->
  <rect x="370" y="150" width="250" height="28" rx="4" fill="#071228" stroke="#D4AF37" stroke-width="1.5"/>
  <text x="495" y="169" font-family="'Outfit', sans-serif" font-size="11" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">DEPARTMENT OF MCA</text>

  <!-- Ground Plaza & Landscaping -->
  <rect x="0" y="440" width="800" height="60" fill="#071228"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#00E5FF" stroke-width="2"/>

  <!-- Light Beam Pillars -->
  <line x1="390" y1="440" x2="390" y2="350" stroke="#00E5FF" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="440" x2="600" y2="350" stroke="#00E5FF" stroke-width="2" opacity="0.6"/>

  <!-- Futuristic Connecting Circuit Lines across Ground -->
  <path d="M 50,470 L 250,470 L 290,490 L 520,490 L 550,470 L 750,470" fill="none" stroke="rgba(0, 180, 216, 0.35)" stroke-width="2"/>
  <circle cx="290" cy="490" r="4" fill="#00E5FF"/>
  <circle cx="520" cy="490" r="4" fill="#00E5FF"/>
</svg>
